<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собрать ланч | Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../lab1/style.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Собрать ланч</h1>
        <nav>
            <a href="../lab1/index.html">Главная</a>
            <a href="lunch.html" class="active">Собрать ланч</a>
            <a href="../lab1/index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main class="menu-main"></main>

    <section class="order-section">
        <h2>Оформить заказ</h2>
        <form action="https://httpbin.org/post" method="POST" class="order-form">
            
            <div class="form-block">
                <h3>Ваш заказ</h3>
                <div id="cart-items">
                    <p class="cart-empty">Ничего не выбрано</p>
                </div>
                <div id="cart-total" style="display: none;">
                    <p><strong>Стоимость заказа: <span id="total-price">0 ₽</span></strong></p>
                </div>
                
                <input type="hidden" name="soup" id="input-soup">
                <input type="hidden" name="main" id="input-main">
                <input type="hidden" name="drink" id="input-drink">
                <input type="hidden" name="salad" id="input-salad">
                <input type="hidden" name="dessert" id="input-dessert">
                
                <div class="form-group" style="margin-top: 20px;">
                    <label for="comment">Комментарий:</label>
                    <textarea id="comment" name="comment" rows="3"></textarea>
                </div>
            </div>

            <div class="form-block">
                <h3>Данные получателя</h3>
                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe" checked>
                    <label for="subscribe">Я согласен получать информацию о скидках и акциях</label>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Адрес доставки:</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <fieldset class="form-group">
                    <legend>Время доставки:</legend>
                    <div class="radio-group">
                        <input type="radio" id="asap" name="delivery_time_type" value="asap" required>
                        <label for="asap">Как можно скорее</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="exact" name="delivery_time_type" value="exact" required>
                        <label for="exact">К точному времени</label>
                    </div>
                </fieldset>
                <div class="form-group">
                    <label for="time">Указать время:</label>
                    <input type="time" id="time" name="time" min="07:00" max="23:00" step="300">
                </div>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn-reset" onclick="resetCart()">Сбросить</button>
                <button type="submit" class="btn-submit">Отправить</button>
            </div>
        </form>
    </section>

    <footer id="contacts">
        <p>Телефон: <a href="tel:+74951234567">+7 (495) 123-45-67</a></p>
        <p>Email: <a href="mailto:order@lunch-delivery.ru">order@lunch-delivery.ru</a></p>
        <p>Адрес: г. Москва, ул. Пушкина, д. 10</p>
    </footer>

     <script src="dishes.js"></script>
    <script src="render.js"></script>
    <script src="cart.js"></script>
    <script src="combo.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderDishes();
            updateCartUI();
            renderCombos(); // Отрисовываем комбо
        });
        
        // Обработчик отправки формы
        document.querySelector('.order-form').addEventListener('submit', (e) => {
            if (!validateCombo()) {
                e.preventDefault(); // Останавливаем отправку, если комбо невалидно
            }
        });
        
        function resetCart() {
            cart = { soup: null, main: null, drink: null, salad: null, dessert: null };
            document.querySelectorAll('.dish-card').forEach(c => c.classList.remove('selected'));
            updateCartUI();
        }
    </script>
</body>
</html>
